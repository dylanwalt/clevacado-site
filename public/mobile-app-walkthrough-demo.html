function stageHotspots(r){const list=[];const stage=(r.stage||'').toLowerCase(),problem=(r.problem||'').toLowerCase();if(r.id==='017'){list.push({key:'sorting',label:'Sorting outfeed',level:'high'});list.push({key:'transport',label:'Local transport route',level:'watch'})}else if(stage.includes('sorting')||problem.includes('sorting')){list.push({key:'sorting',label:'Sorting outfeed',level:r.risk>=70?'high':'watch'})}else if(stage.includes('local transport')||problem.includes('transport')||problem.includes('shaking')){list.push({key:'transport',label:'Local transport route',level:r.risk>=70?'high':'watch'})}else if(stage.includes('export')){list.push({key:'export',label:'Export staging',level:r.risk>=70?'high':'watch'})}else if(stage.includes('loading')){list.push({key:'loading',label:'Loading area',level:r.risk>=70?'high':'watch'})}else if(stage.includes('harvest')||stage.includes('block')){list.push({key:'orchard',label:'Orchard block',level:r.risk>=70?'high':'watch'})}return list}
function farmMapMarkup(r){const points={orchard:[72,76],sorting:[192,100],loading:[220,124],transport:[149,172],export:[281,126]};const markers=stageHotspots(r);const hasGps=!!gps(r.id);const gpsPoint=hasGps?[92,148]:null;const markerSvg=markers.map((m,i)=>{const p=points[m.key]||points.sorting;const c=m.level==='high'?'#bc654a':'#d4a646';const y=p[1]-i*4;return `<g><line x1="${p[0]}" y1="${y}" x2="${p[0]}" y2="${y+14}" stroke="${c}" stroke-width="3"/><circle cx="${p[0]}" cy="${y}" r="9" fill="${c}" stroke="#fff8f1" stroke-width="3"/><circle cx="${p[0]}" cy="${y}" r="2.6" fill="#fff8f1"/></g>`}).join('');const gpsSvg=gpsPoint?`<g><line x1="${gpsPoint[0]}" y1="${gpsPoint[1]-2}" x2="${gpsPoint[0]}" y2="${gpsPoint[1]+12}" stroke="#2e7a58" stroke-width="3"/><circle cx="${gpsPoint[0]}" cy="${gpsPoint[1]-6}" r="8" fill="#2e7a58" stroke="#fffefa" stroke-width="3"/><circle cx="${gpsPoint[0]}" cy="${gpsPoint[1]-6}" r="2.5" fill="#fffefa"/></g>`:'';const chips=markers.length?markers.map(m=>`<span class="mapchip"><span class="mapdot ${m.level}"></span>${escapeHTML(m.label)}</span>`).join(''):`<span class="mapchip"><span class="mapdot info"></span>No clear hotspot was flagged for this run</span>`;const gpsChip=hasGps?`<span class="mapchip"><span class="mapdot info"></span>Your saved GPS pin</span>`:'';return `<div class="farmmap"><svg viewBox="0 0 330 210" role="img" aria-label="Approximate illustrated farm journey map"><rect width="330" height="210" fill="#f5f6f0"/><rect x="13" y="12" width="93" height="82" rx="16" fill="#d8ecd0" stroke="#9ab68e"/><text x="27" y="32" font-size="11" fill="#355438" font-family="Arial" font-weight="700">ORCHARD</text><text x="27" y="46" font-size="10" fill="#57725a" font-family="Arial">Blocks 1, 2, 4, 5, 6</text><g fill="#6ea26c"><circle cx="35" cy="61" r="10"/><circle cx="63" cy="69" r="11"/><circle cx="87" cy="57" r="9"/><circle cx="40" cy="84" r="9"/><circle cx="74" cy="84" r="10"/></g><rect x="124" y="66" width="96" height="76" rx="12" fill="#efe6d3" stroke="#b7a584"/><rect x="138" y="81" width="42" height="22" rx="5" fill="#b7d88c" stroke="#709c55"/><rect x="185" y="81" width="22" height="48" rx="4" fill="#d8c3a2" stroke="#9d886f"/><text x="137" y="59" font-size="11" fill="#355438" font-family="Arial" font-weight="700">PACKHOUSE</text><text x="137" y="153" font-size="10" fill="#57725a" font-family="Arial">Sorting · loading · cold room</text><rect x="254" y="82" width="58" height="55" rx="10" fill="#d9e6c3" stroke="#8fa277"/><text x="263" y="74" font-size="11" fill="#355438" font-family="Arial" font-weight="700">EXPORT</text><text x="259" y="149" font-size="10" fill="#57725a" font-family="Arial">Staging area</text><path d="M76 110 C100 117, 121 132, 139 149 C157 166, 185 176, 209 174 C239 171, 260 164, 291 147" fill="none" stroke="#9aa3a5" stroke-width="18" stroke-linecap="round"/><path d="M76 110 C100 117, 121 132, 139 149 C157 166, 185 176, 209 174 C239 171, 260 164, 291 147" fill="none" stroke="#f3f4f3" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 11"/><text x="118" y="196" font-size="10" fill="#57725a" font-family="Arial">Local transport route</text>${markerSvg}${gpsSvg}</svg></div><div class="map-legend">${chips}${gpsChip}</div><p class="map-caption">Approximate clipart-style farm map for communication only. It shows the likely process area for this run, not a surveyed site plan or measured event coordinates.</p>`}

const exampleNote=`<div class="disclaimer">Illustrative customer app. Only run #017 reflects the provided mock report. Other journeys and weekly totals are demonstration records. Risk is a handling-priority signal, not a measured percentage of bruised fruit.</div>`;
function home(){let selected=state.showAll?runs:runs.slice(0,4);return `<div class="screen"><section class="hero"><div class="eyebrow bright">POST-HARVEST VISIBILITY · 12–18 JUN 2026</div><h1 class="serif">See where<br/>quality risk<br/>enters the journey.</h1><p class="subtext">A simple view of how your avocados were handled this week.</p><div class="hero-rule"></div><div class="overview-flex"><span class="overview-number">8</span><span class="overview-caption">journeys<br/>checked this week</span></div><div class="hero-rule" style="margin:16px 0"></div><div class="mini-stats"><div class="highlight"><b>2</b><small>Need attention</small></div><div><b>1</b><small>Keep an eye on</small></div><div><b>5</b><small>Looking good</small></div></div></section>
<div class="content"><div class="eyebrow dark">WHERE TO START</div><button class="feature" data-open="017"><div class="eyebrow flag">FIRST PLACE TO CHECK</div><div class="featuretitle">The sorting<br/>outfeed.</div><p>One run recorded a strong knock as crates left the sorting line. See where it happened and what to check.</p><span class="arrow">View diagnostic #017 →</span></button><div class="sectionlabel between"><div><div class="eyebrow dark">YOUR DIAGNOSTICS</div><h2 class="serif">This week's journeys.</h2></div><button class="text-button" id="toggleall">${state.showAll?'Show fewer':'See all 8 →'}</button></div><p class="intro">Tap a journey to see what happened.</p><div class="runlist">${selected.map(runCard).join('')}</div>${exampleNote}</div></div>`}
function stageUI(){return `<div class="whitebox">${stages.map(s=>`<div class="stagerow ${sev(s.risk)}"><div class="labelrow"><b>${s.name}</b><span>${s.risk}/100</span></div><div class="line"><div class="fill" style="width:${s.risk}%"></div></div><small>${s.hint}</small></div>`).join('')}</div>`}
function mapSection(r){let p=gps(r.id);let coords=p?`${Number(p.lat).toFixed(6)}, ${Number(p.lng).toFixed(6)}`:'';return `<div class="mapcard"><div class="locationicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1116 0Z"/><circle cx="12" cy="10" r="2.5"/></svg> WHERE IT HAPPENED</div><div class="boxheadline">${escapeHTML(r.stage)}</div><p class="boxcopy">${r.id==='017'?'The report links the strongest event to the sorting transfer. The transport route is another area to investigate.':'This view shows the approximate area to inspect first.'}</p>${farmMapMarkup(r)}${p?`<div class="locationcode">${coords}</div><p class="gps-note">${escapeHTML(p.method)} · ${p.accuracy!=null?`approximately ${Math.round(p.accuracy)} m phone accuracy · `:''}Customer-added pin, not sensor-recorded event coordinates.</p><iframe class="map-preview" title="Customer-added location map" loading="lazy" referrerpolicy="no-referrer" data-map-embed="${r.id}"></iframe><button class="big-button dark-button" data-showmap="${r.id}" style="margin-top:12px">Open saved pin in maps ↗</button><button class="subtle-button" data-clear="${r.id}">Remove saved pin</button>`:`<p class="gpspending">Exact GPS pin not recorded.</p><p class="gps-note">Use the illustrated farm map above to see the likely problem area. Add a GPS pin only if you know the real location on the farm.</p><button class="big-button dark-button" data-setgps="${r.id}">Add exact GPS location →</button>`}</div>`}
function detail(){let r=getRun(state.run),actual=r.id==='017',high=sev(r.risk);let title=actual?'A hard knock<br/>at sorting.':r.problem.replace(' at ','<br/>at ').replace(' during ','<br/>during ');let lead=actual?'The highest concern was where crates moved off the sorting line. The local transport journey also needs attention.':r.demo?'An example of how this diagnostic would appear in a customer account.':'This diagnostic needs a closer look.';
return `<div class="screen"><section class="detailhero"><button class="back" data-nav="home">← Back to all journeys</button><div class="eyebrow bright">${r.date.toUpperCase()} 2026 · ${escapeHTML(r.block.toUpperCase())} · RUN #${r.id}</div><h1 class="serif">${title}</h1><p class="lead">${lead}</p><div class="riskline"><b>${r.risk}<small>/100</small></b><span>${label(r.risk)}<br/>Handling risk score</span></div></section><div class="bodydetail"><p class="gps-note">A higher score means a greater reason to investigate, not that ${r.risk}% of fruit was bruised.</p><div class="eyebrow dark">THE PLACE TO CHECK</div>${mapSection(r)}<div class="sectionlabel"><div class="eyebrow dark">WHAT THE CRATE FELT</div><h2 class="serif">The key readings.</h2></div><div class="data-row"><div class="data-cell"><b>${r.peak}</b><small>Biggest knock</small></div><div class="data-cell"><b>${r.vibration}</b><small>Elevated shaking</small></div><div class="data-cell"><b>${r.compression}</b><small>Highest load</small></div></div>${actual?`<div class="sectionlabel"><div class="eyebrow dark">THE FULL JOURNEY</div><h2 class="serif">Where risk built up.</h2></div>${stageUI()}<div class="sectionlabel"><div class="eyebrow dark">WHAT TO DO NEXT</div><h2 class="serif">Small changes. Better handling.</h2></div><div class="whitebox"><div class="actionrow"><span class="actionnum">1</span><div><b>Inspect the sorting outfeed</b><p>Check for drops, hard edges and crates knocking into each other.</p></div></div><div class="actionrow"><span class="actionnum">2</span><div><b>Review the local transport route</b><p>There were 35 minutes of elevated shaking. Check the route, speed and crate position.</p></div></div><div class="actionrow"><span class="actionnum">3</span><div><b>Repeat the journey after changes</b><p>Compare the next run to see if handling conditions improved.</p></div></div></div>`:`<div class="whitebox" style="margin-top:18px"><div class="boxlabel">Next step</div><p class="boxcopy">${r.risk>=70?'Inspect the affected stage and repeat the run.':r.risk>=45?'Keep an eye on this handling stage in the next journey.':'No urgent issue is indicated by this demonstration run.'}</p></div>`}<button class="big-button" data-helpfor="${r.id}" style="margin-top:19px">Ask ClevaCado to help fix this →</button><div class="disclaimer">${actual?'Metrics are from the supplied sample report, not verified on-farm telemetry. The mock report does not include measured GPS event coordinates.':'This additional run is fictional demonstration data.'} Stage scores are process-triage signals, not proof of fruit bruising or responsibility.</div></div></div>`}
function locationForm(){let r=getRun(state.run);return `<div class="screen"><div class="bodydetail"><button class="back" data-page="detail">← Back to diagnostic</button><div class="eyebrow dark">RUN #${r.id} · LOCATION</div><h1 class="serif secttitle" style="font-size:37px;margin:10px 0">Pin the place<br/>to investigate.</h1><p class="form-intro">The report identifies the handling stage, but does not provide verified event GPS. Enter a known coordinate, or capture your phone's position while standing at the affected spot.</p><form id="locationForm"><div class="field-grid"><div><label class="field" for="latitude">Latitude</label><input id="latitude" class="input" type="number" step="any" min="-90" max="90" placeholder="-23.123456"/></div><div><label class="field" for="longitude">Longitude</label><input id="longitude" class="input" type="number" step="any" min="-180" max="180" placeholder="30.123456"/></div></div><p class="helper">Coordinates must refer to the actual problem area. Do not enter an estimated location as an exact pin.</p><button class="big-button dark-button" type="submit">Save map pin →</button></form><button class="big-button outline-button" id="phonegps" style="margin-top:10px">Use my phone's GPS</button><div class="whitebox" style="margin-top:20px"><div class="boxlabel">Important</div><p class="boxcopy">Your phone records where you are now. It does <b>not</b> tell us where the earlier crate incident occurred. Only capture it when physically at that spot. GPS requires permission and usually HTTPS.</p></div></div></div>`}
function help(){let r=getRun(state.run);return `<div class="screen"><section class="detailhero" style="padding-top:25px"><div class="eyebrow bright">CLEVaCADO FIELD SUPPORT</div><h1 class="serif">Let's find<br/>a better way.</h1><p class="lead">Not sure how to fix a problem? Tell us which journey you're concerned about. We can discuss the findings and a possible farm or packhouse visit.</p></section><div class="bodydetail"><div class="whitebox"><div class="boxlabel">What we can help with</div><p class="boxcopy">Finding the problem area, checking handling practices, and planning another diagnostic after changes.</p></div><form id="helpForm"><label class="field" for="clientname">Your name</label><input required class="input" id="clientname" name="name" placeholder="Your name"/><label class="field" for="contact">How can we reach you?</label><input required class="input" id="contact" name="contact" placeholder="Phone or email"/><label class="field" for="relatedrun">Which journey?</label><select class="input" id="relatedrun" name="run">${runs.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>#${x.id} · ${x.block} · ${x.problem}</option>`).join('')}</select><label class="field" for="helpkind">What kind of help?</label><select class="input" id="helpkind" name="helpkind"><option value="Please contact me to discuss the problem and whether an on-site visit would help.">Talk through the problem</option><option value="I would like to arrange an on-farm or packhouse visit to inspect and help fix the issue.">Request an on-farm visit</option><option value="I would like help setting up a repeat diagnostic to confirm the change worked.">Repeat a diagnostic</option></select><label class="field" for="additional">Anything else we should know? (optional)</label><textarea class="input" name="note" rows="3" id="additional" placeholder="Tell us more..."></textarea><button class="big-button" type="submit" style="margin-top:18px">Prepare help request →</button></form><p class="helper">This demo prepares a message for you to send. It does not submit your information to ClevaCado or book a visit.</p><a class="small-link" target="_blank" rel="noopener" href="https://clevacado.co.za/">ClevaCado website ↗</a></div></div>`}
function requestReady(){return `<div class="screen"><div class="bodydetail"><button class="back" data-nav="help">← Back to request</button><div class="request-summary"><div class="eyebrow bright">YOUR MESSAGE IS READY</div><h1 class="serif">Start a clearer<br/>conversation.</h1><p>Copy or email your request, including the handling issue and any GPS pin you have added.</p></div><label class="field" for="requestoutput">Prepared request</label><textarea class="input" id="requestoutput" rows="12" readonly>${escapeHTML(state.helpText)}</textarea><button class="big-button dark-button" style="margin-top:12px" id="copyreq">Copy message</button><button class="big-button outline-button" style="margin-top:10px" id="emailreq">Open an email draft</button><p class="helper">We haven't verified an official support inbox, so the email draft leaves the recipient blank. No request has been submitted.</p><a class="small-link" href="https://clevacado.co.za/" target="_blank" rel="noopener">Find ClevaCado contact details ↗</a></div></div>`}
function toast(s){const el=$('toast');el.textContent=s;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',3200)}
function activateMaps(){viewport.querySelectorAll('[data-map-embed]').forEach(el=>{const p=gps(el.dataset.mapEmbed);if(!p)return;const d=.004;const url=`https://www.openstreetmap.org/export/embed.html?bbox=${p.lng-d}%2C${p.lat-d}%2C${p.lng+d}%2C${p.lat+d}&layer=mapnik&marker=${p.lat}%2C${p.lng}`;el.src=url})}
function render(){viewport.innerHTML=({home,detail,locationForm,help,requestReady}[state.page]||home)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('selected',b.dataset.nav===(state.page==='help'||state.page==='requestReady'?'help':'home')));viewport.scrollTop=0;document.title='ClevaCado · '+(state.page==='home'?'Your journeys':state.page==='detail'?'Diagnostic #'+state.run:'Support');activateMaps()}
document.addEventListener('click',async e=>{let el=e.target.closest('button');if(!el)return;
if(el.dataset.open){state.run=el.dataset.open;state.page='detail';render()}else if(el.dataset.nav){state.page=el.dataset.nav;render()}else if(el.dataset.page){state.page=el.dataset.page;render()}else if(el.dataset.helpfor){state.run=el.dataset.helpfor;state.page='help';render()}else if(el.id==='toggleall'){state.showAll=!state.showAll;render()}else if(el.dataset.setgps){state.run=el.dataset.setgps;state.page='locationForm';render()}else if(el.dataset.clear){deletegps(el.dataset.clear);render()}else if(el.dataset.showmap){let p=gps(el.dataset.showmap);if(p)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lat+','+p.lng),'_blank','noopener')}
else if(el.id==='phonegps'){if(!navigator.geolocation){toast('GPS is unavailable in this browser.');return}el.disabled=true;el.textContent='Finding your location…';navigator.geolocation.getCurrentPosition(pos=>{savegps(state.run,{lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,method:'Captured on this phone at its current location'});state.page='detail';render()},()=>{el.disabled=false;el.textContent="Use my phone's GPS";toast('Could not get location. Check permission or use HTTPS.')},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
else if(el.id==='copyreq'){let tx=$('requestoutput').value;try{await navigator.clipboard.writeText(tx);toast('Request copied to clipboard.')}catch{$('requestoutput').select();toast('Select and copy the message.')}}else if(el.id==='emailreq'){location.href='mailto:hello@clevacado.co.za?subject='+encodeURIComponent('ClevaCado · assistance request')+'&body='+encodeURIComponent(state.helpText)}
});
document.addEventListener('submit',e=>{if(e.target.id==='locationForm'){e.preventDefault();let lat=$('latitude').value,lon=$('longitude').value;if(!lat.trim()||!lon.trim()||!Number.isFinite(+lat)||!Number.isFinite(+lon)||+lat < -90||+lat>90||+lon < -180||+lon>180){toast('Enter valid latitude and longitude.');return}savegps(state.run,{lat:+lat,lng:+lon,method:'Entered manually by the customer'});state.page='detail';render()}
if(e.target.id==='helpForm'){e.preventDefault();let v=new FormData(e.target),r=getRun(v.get('run')),p=gps(r.id);state.run=r.id;state.helpText=`CLEVaCADO / ON-FARM SUPPORT REQUEST\n\nName: ${v.get('name')}\nContact: ${v.get('contact')}\nRun: #${r.id} — ${r.block} (${r.date} 2026)\nIssue: ${r.problem}\nWhere: ${r.stage}\nHandling risk score: ${r.risk}/100\nGPS: ${p?`${Number(p.lat).toFixed(6)}, ${Number(p.lng).toFixed(6)} (${p.method}; customer-added, not a device-measured event location)`:'Exact event GPS not recorded'}\nRequest: ${v.get('helpkind')}\nAdditional details: ${v.get('note')||'None supplied'}\n\nPlease contact me to discuss the next steps.\n\nGenerated using a ClevaCado demonstration app — please verify all report information.`;state.page='requestReady';render()}});
render();

})();
</script></body></html>
