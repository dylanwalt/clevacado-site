<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>ClevaCado enquiry form</title></head>
  <body>
    <form name="pilot-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pilot-request">
      <input type="email" name="email">
      <input type="text" name="name">
      <input type="text" name="company">
      <textarea name="message"></textarea>
      <input type="text" name="submission_stage">
      <input type="text" name="bot-field">
    </form>
  </body>
</html>
