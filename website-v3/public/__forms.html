<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Form definitions</title></head>
  <body>
    <form name="field-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="field-enquiry">
      <input type="hidden" name="subject" value="New ClevaCado website enquiry">
      <input type="hidden" name="submission-stage" value="Completed enquiry">
      <input name="bot-field" type="text">
      <input name="name" type="text">
      <input name="email" type="email" required>
      <input name="organisation" type="text">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
