<!doctype html><html lang="en"><meta charset="utf-8"><title>Presentation route and layout check</title><pre id="result">Loading…</pre><iframe id="frame" title="Presentation check"></iframe><script>
const frame=document.getElementById('frame'),q=new URLSearchParams(location.search);frame.width=q.get('w')||'1366';frame.height=q.get('h')||'768';frame.src='../#home';
frame.addEventListener('load',async()=>{try{const d=frame.contentDocument,w=frame.contentWindow,slides=w.PRESENTATION.slides;const tick=()=>new Promise(r=>w.requestAnimationFrame(r)),pause=ms=>new Promise(r=>setTimeout(r,ms));const failures=[];let images=0,modelReady=false,autoSplit=false;
for(let i=0;i<slides.length;i++){
 await tick();const slide=d.querySelector('.slide'),copy=d.querySelector('.slide-copy'),media=d.querySelector('.slide-media');if(slide?.dataset.slide!==slides[i].id)failures.push({step:i,error:'wrong slide',expected:slides[i].id,actual:slide?.dataset.slide});
 const c=copy.getBoundingClientRect(),m=media.getBoundingClientRect();for(const el of copy.querySelectorAll('h1,.detail,.support-lines,.source-link')){const r=el.getBoundingClientRect();if(r.left<c.left-2||r.right>c.right+2||r.top<c.top-2||r.bottom>c.bottom+2)failures.push({step:i,error:'text outside copy area',text:el.textContent,box:[r.left-c.left,r.top-c.top,r.right-c.right,r.bottom-c.bottom].map(Math.round)});}
 if(c.left<m.right-1&&c.right>m.left+1&&c.top<m.bottom-1&&c.bottom>m.top+1)failures.push({step:i,error:'text and visual overlap'});
 const img=media.querySelector('img');if(img){try{await img.decode();images++}catch{failures.push({step:i,error:'image did not decode',src:img.src})}}
 if(slides[i].media==='model'){for(let t=0;t<100&&!d.querySelector('.model-media.ready')&&!d.querySelector('#model-button').hidden;t++)await pause(50);modelReady=!!d.querySelector('.model-media.ready');if(modelReady){await pause(1600);autoSplit=d.querySelector('#model-button').getAttribute('aria-pressed')==='true';d.querySelector('#model-button').click();if(d.querySelector('#model-button').getAttribute('aria-pressed')!=='false')failures.push({step:i,error:'model close failed'});}else failures.push({step:i,error:'model did not load'});}
 const footer=d.querySelector('.bottom').getBoundingClientRect(),controls=d.querySelector('.controls').getBoundingClientRect(),nav=d.querySelector('.sections').getBoundingClientRect();if(controls.left<nav.right-2||controls.right>footer.right+2)failures.push({step:i,error:'footer overlap'});
 if(i<slides.length-1)d.querySelector('#next').click();
}
const nextDisabled=d.querySelector('#next').disabled;for(let i=slides.length-1;i>=0;i--){await tick();if(d.querySelector('.slide')?.dataset.slide!==slides[i].id)failures.push({step:i,error:'reverse navigation'});if(i>0)d.querySelector('#previous').click();}
const previousDisabled=d.querySelector('#previous').disabled;w.location.hash='build';await pause(50);const oldHashWorks=d.querySelector('.slide')?.dataset.slide==='problem';if(!oldHashWorks)failures.push({error:'legacy build hash'});
document.getElementById('result').textContent=JSON.stringify({pass:!failures.length&&modelReady&&autoSplit&&nextDisabled&&previousDisabled,viewport:[w.innerWidth,w.innerHeight],slides:slides.length,images,modelReady,autoSplit,nextDisabled,previousDisabled,oldHashWorks,failures});
}catch(error){document.getElementById('result').textContent=JSON.stringify({pass:false,error:String(error),stack:error.stack})}});
</script></html>
