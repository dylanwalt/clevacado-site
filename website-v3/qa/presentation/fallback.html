<!doctype html><html lang="en"><meta charset="utf-8"><title>Presentation fallback check</title><pre id="result">Loading…</pre><iframe id="frame" title="No WebGL check" width="1000" height="650"></iframe><script>
const frame=document.getElementById('frame');fetch('../index.html').then(r=>r.text()).then(html=>{const injection=`<script>const old=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){if(String(type).includes('webgl'))return null;return old.call(this,type,...args)};<\/script>`;frame.srcdoc=html.replace('<head>','<head>'+injection)});frame.addEventListener('load',async()=>{const d=frame.contentDocument;if(!d.querySelector('.presentation'))return;const pause=ms=>new Promise(r=>setTimeout(r,ms));for(let i=0;i<200&&!d.querySelector('[data-section="problem"]');i++)await pause(25);d.querySelector('[data-section="problem"]').click();d.querySelector('#next').click();d.querySelector('#next').click();for(let i=0;i<200&&!d.querySelector('#model-button')?.hidden;i++)await pause(25);const status=d.querySelector('#model-status')?.textContent,button=d.querySelector('#model-button');const fallback=status==='Static CAD preview'&&button?.hidden;d.querySelector('#next').click();const nextWorks=d.querySelector('.slide')?.dataset.slide==='data';document.getElementById('result').textContent=JSON.stringify({pass:fallback&&nextWorks,fallback,status,nextWorks});});
</script></html>
