[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/mobile-app-walkthrough"
to = "/mobile-app-walkthrough/index.html"
status = 200
force = true

[[redirects]]
from = "/mobile-app-walkthrough/"
to = "/mobile-app-walkthrough/index.html"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
