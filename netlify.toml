[build]
base = "website-v3"
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[redirects]]
from = "/mobile-app-walkthrough"
to = "/mobile-app-walkthrough/index.html"
status = 200
force = true

[[redirects]]
from = "/mobile-app-walkthrough/"
to = "/mobile-app-walkthrough/index.html"
status = 200
force = true

[[redirects]]
from = "/presentation/index.html"
to = "/presentation-v2/index.html"
status = 200
force = true

[[redirects]]
from = "/presentation"
to = "/presentation-v2/index.html"
status = 200
force = true

[[redirects]]
from = "/presentation/"
to = "/presentation-v2/index.html"
status = 200
force = true

[[redirects]]
from = "/presentation-v2"
to = "/presentation"
status = 301
force = true

[[redirects]]
from = "/presentation-v2/"
to = "/presentation"
status = 301
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/presentation/assets/optimized/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
